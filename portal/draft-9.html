<title>CILNI Payroll Portal Draft 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@700;900&family=Open+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --cadet:#1D2951; --cadet-2:#27366A; --lemon:#F5C71A; --on-lemon:#1D2951;
  --bg:#F3F4F8; --surface:#FFFFFF; --sunk:#EEF0F6; --ink:#1A2036; --muted:#5A6380; --line:#E0E3EC;
  --accent:#1D2951; --soft:#FFF6D6; --mark:#F5C71A;
  --btn-bg:#1D2951; --btn-fg:#FFFFFF;
  --shadow:0 1px 2px rgba(29,41,81,.06),0 12px 32px -12px rgba(29,41,81,.22);
  --head:"Lato","Segoe UI",system-ui,sans-serif; --body:"Open Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1429; --surface:#19213F; --sunk:#222B4C; --ink:#EDEFF6; --muted:#A9B1CD; --line:#2E3860;
    --accent:#F5C71A; --soft:#2B2914; --mark:rgba(245,199,26,.32);
    --btn-bg:#F5C71A; --btn-fg:#1D2951;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 36px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1429; --surface:#19213F; --sunk:#222B4C; --ink:#EDEFF6; --muted:#A9B1CD; --line:#2E3860;
  --accent:#F5C71A; --soft:#2B2914; --mark:rgba(245,199,26,.32);
  --btn-bg:#F5C71A; --btn-fg:#1D2951;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 36px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;overflow-x:hidden}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* stage band */
.stage{background:var(--cadet);color:#fff;padding-inline:16px;padding-bottom:84px;position:relative}
.stage-in{max-width:600px;margin:0 auto;position:relative;z-index:1}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{height:clamp(46px,12vw,60px);width:auto;display:block;flex:none}
.brand-tag{font-family:var(--head);font-weight:900;font-size:clamp(15px,4vw,17px);color:#fff;padding-left:10px;border-left:1.5px solid rgba(255,255,255,.3);line-height:1.2}
.talk{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff;font:600 14px var(--body);border-radius:999px;padding:7px 14px;cursor:pointer}
.talk svg{width:16px;height:16px;color:var(--lemon)}
.talk:hover{background:rgba(255,255,255,.14)}
.mockline{font-size:12px;color:rgba(255,255,255,.55);margin:0 0 18px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between}
.saved{display:inline-flex;align-items:center;gap:5px;color:rgba(255,255,255,.8);font-weight:600}
.saved svg{width:14px;height:14px;color:var(--lemon);stroke-width:3}
.summary{display:grid;gap:12px}
.sumrow{display:flex;gap:14px;align-items:center;background:var(--sunk);border-radius:14px;padding:14px 16px}
.sumrow .ico{background:var(--surface)}
.sumrow small{display:block;color:var(--muted);font-size:13.5px}
.sumrow b{display:block;line-height:1.35}
.tile.part .s{color:var(--accent);font-weight:600}

.stage h1,.stage h2{color:#fff}
.stage .sub{color:rgba(255,255,255,.75);margin-top:6px}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--lemon)}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:rgba(255,255,255,.8);font:600 14px var(--body);cursor:pointer;padding:4px 0;margin-bottom:10px}
.back svg{width:18px;height:18px}
.back:hover{color:#fff}

main{max-width:600px;margin:-64px auto 0;padding-inline:16px;padding-bottom:56px;position:relative;z-index:2}
h1,h2,h3{font-family:var(--head);line-height:1.18;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,7vw,40px);font-weight:900}
h2{font-size:clamp(24px,5.5vw,30px);font-weight:900}
h3{font-size:19px;font-weight:900}
p{margin:0}
.muted{color:var(--muted)}
.panel{background:var(--surface);border-radius:22px;padding:clamp(22px,5.5vw,34px);display:grid;gap:18px;box-shadow:var(--shadow)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 16px var(--body);border-radius:999px;padding:14px 24px;cursor:pointer;border:1.5px solid transparent;min-height:54px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.plain{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.round{width:54px;padding:0;flex:none}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none}
.btn.wait{position:relative;overflow:hidden;cursor:progress;filter:none}
.btn.wait::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--lemon);transform-origin:left;transform:scaleX(0);animation:fillbar var(--wait,1500ms) linear forwards}
@keyframes fillbar{to{transform:scaleX(1)}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary.wait::after{background:var(--cadet)}}
:root[data-theme="dark"] .btn.primary.wait::after{background:var(--cadet)}
:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1 1 170px}
.link{background:none;border:0;padding:0;color:var(--accent);font:700 15px var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.center{text-align:center;margin-top:16px}

/* welcome */
.video{aspect-ratio:16/9;max-width:100%;border-radius:16px;background:linear-gradient(135deg,var(--cadet),var(--cadet-2));color:#fff;display:grid;place-items:center;text-align:center;font-weight:600;font-size:15px;position:relative;overflow:hidden}
.play{width:64px;height:64px;border-radius:50%;background:var(--lemon);color:var(--cadet);display:grid;place-items:center;margin:0 auto 10px;box-shadow:0 0 0 10px rgba(245,199,26,.18)}
.play svg{width:26px;height:26px;fill:currentColor;stroke:none;margin-left:3px}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ticks li{display:flex;gap:12px;align-items:flex-start}
.ticks svg{width:22px;height:22px;color:var(--on-lemon);background:var(--lemon);border-radius:50%;padding:4px;stroke-width:3;margin-top:2px}

/* hub */
.meter{display:flex;align-items:center;gap:14px;margin-top:16px}
.meter .track{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.meter .track i{display:block;height:100%;background:var(--lemon);border-radius:9px;transition:width .5s}
.meter b{font-family:var(--head);font-size:15px;white-space:nowrap}
.tiles{display:grid;gap:10px;margin-bottom:20px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:0;border-radius:18px;padding:14px 16px;cursor:pointer;color:var(--ink);font:inherit;box-shadow:var(--shadow);transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--sunk);color:var(--accent);position:relative}
.tile.next .ico{background:var(--lemon);color:var(--on-lemon)}
.tile .badge{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:var(--lemon);color:var(--on-lemon);display:grid;place-items:center;border:2px solid var(--surface)}
.tile .badge svg{width:12px;height:12px;stroke-width:3.2}
.tile .t{font-weight:700;display:block;line-height:1.3}
.tile .s{font-size:14px;color:var(--muted)}
.tile.next .s{color:var(--accent);font-weight:600}
.tile .go{margin-left:auto;color:var(--muted)}
.tile .go svg{width:20px;height:20px}
.lock{display:flex;justify-content:center;align-items:center;gap:6px;font-size:14px;margin-top:10px}
.lock svg{width:16px;height:16px}

/* card */
.segs{display:flex;gap:5px;margin-top:14px}
.segs i{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.18)}
.segs i.on{background:var(--lemon)}
.card{min-height:380px;align-content:start}
.card-ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--soft);color:var(--accent)}
.card-ico svg{width:28px;height:28px}
.fact{display:inline-block;justify-self:start;font-family:var(--head);font-weight:900;font-size:clamp(30px,8vw,42px);line-height:1.1;background:var(--lemon);color:var(--on-lemon);padding:10px 18px;border-radius:14px;transform:rotate(-1.2deg)}
.mark{background:linear-gradient(transparent 58%,var(--mark) 58%);font-weight:700;padding-inline:2px}
.warn{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:14px 16px;font-weight:700}
.warn svg{color:var(--accent);margin-top:1px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:36px 1fr;gap:14px;align-items:center;padding-bottom:14px;position:relative;font-weight:700}
.steps li::before{content:counter(st);width:36px;height:36px;border-radius:50%;background:var(--lemon);color:var(--on-lemon);display:grid;place-items:center;font-family:var(--head);font-weight:900;z-index:1}
.steps li:not(:last-child)::after{content:"";position:absolute;left:17px;top:36px;bottom:0;width:2px;background:var(--line)}
details{border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none;display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sunk);font-weight:900;transition:transform .2s}
details[open] summary::before{transform:rotate(45deg)}
details p{margin-top:10px;color:var(--muted)}
.calc{display:grid;gap:8px;background:var(--sunk);border-radius:16px;padding:16px}
label{font-weight:600;font-size:15px}
input[type=date],input[type=tel],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;max-width:100%}
.result{font-weight:700;min-height:1.6em}
.cardnav{display:flex;align-items:center;gap:10px;margin-top:16px}
.cardnav .grow{text-align:center;line-height:1.3}
.btn.round{height:54px}
.panel.card{touch-action:pan-y}.cardnav .grow{flex:1}

/* card header tools */
.cardbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.cardbar .back{margin:0}
.tools{display:flex;gap:8px}
.tool{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;display:grid;place-items:center;cursor:pointer;font:900 16px var(--head)}
.tool small{font-size:11px}
.tool svg{width:20px;height:20px}
.tool[aria-pressed="true"]{background:var(--lemon);border-color:var(--lemon);color:var(--on-lemon)}
body.in-card .mockline{display:none}
body.in-card .topbar{padding-block:10px 12px}
body.in-card .brand .logo{height:40px}
body.in-card .brand-tag{font-size:15px}
body.big #app{zoom:1.18}

/* lists on cards and key facts */
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list li{display:flex;gap:14px;align-items:flex-start;background:var(--sunk);border-radius:14px;padding:14px 16px}
.list .ico{width:40px;height:40px;border-radius:12px;background:var(--surface);color:var(--accent)}
.list .ico svg{width:22px;height:22px}
.list b{display:block;font-family:var(--head);font-weight:900;line-height:1.3}
.facts .list li{padding:12px 14px}

/* tap-to-explain words */
.term{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:help;text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.term:hover{color:var(--accent)}
.def{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:15.5px}
.def b{display:block;font-family:var(--head);font-size:16px}
.def b::first-letter{text-transform:uppercase}
.facts .eyebrow{color:var(--accent)}
.def .x{margin-left:auto;flex:none;width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
.facts{margin-top:16px}

/* on phones, keep Back and Next in the same place at the bottom of the screen */
@media (max-width:700px){
  .cardnav{position:fixed;left:0;right:0;bottom:0;z-index:5;margin:0;padding:18px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 75%,transparent)}
  body.in-card main{padding-bottom:110px}
}

/* welcome video row */
.vidrow{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--cadet),var(--cadet-2));color:#fff;border-radius:16px;padding:14px 16px;text-decoration:none}
.vidrow .play{width:48px;height:48px;margin:0;box-shadow:0 0 0 6px rgba(245,199,26,.18);flex:none}
.vidrow .play svg{width:20px;height:20px}
.vidrow b{display:block;font-family:var(--head);font-size:17px}
.vidrow small{display:block;color:rgba(255,255,255,.75);font-size:14px}
a.vidrow:hover{filter:brightness(1.1)}

/* display menu */
.hubbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.menu{position:fixed;z-index:30;width:min(300px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border-radius:18px;padding:16px;box-shadow:0 18px 50px -12px rgba(0,0,0,.45);display:grid;gap:8px}
.mlabel{font-weight:700;font-size:14px;color:var(--muted)}
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:999px;padding:4px}
.seg button{flex:1;border:0;border-radius:999px;background:transparent;color:var(--ink);font:600 14px var(--body);padding:8px 6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg)}

/* search */
.search{display:grid;gap:8px;margin-bottom:16px}
.search label{font-weight:700}
.search input{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:12px 18px;width:100%;box-shadow:var(--shadow)}
#results{display:grid;gap:10px}
.tile.hit .s{display:block}
.tile.hit .snip{margin-top:2px}
.noresult{padding:8px 4px}

/* swipe hint */
.swipehint{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:14px;margin-top:12px}
.swipehint svg{width:22px;height:22px;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.swipehint svg{animation:sway 1.6s ease-in-out infinite}@keyframes sway{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}}

.ring a{color:inherit}

/* documents: explanation beside the page on wide screens */
.side{display:none}
@media (min-width:900px){
  body.wide .stage-in,body.wide main{max-width:980px}
  body.wide .tiles{grid-template-columns:1fr 1fr}
  body.wide .tiles > .tile:last-child:nth-child(odd){grid-column:1/-1}
  .panel.docpanel{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);align-items:start;column-gap:32px}
  .docpanel .doc-left{display:grid;gap:18px;align-content:start}
  .docpanel .explain,.docpanel .docbox .count{display:none}
  .docpanel .side{display:grid;gap:6px;background:var(--sunk);border-radius:14px;padding:16px 18px;font-size:15.5px}
  .docpanel .side b{font-family:var(--head);font-size:18px}
  .docpanel .side .count{margin-top:6px}
  .docpanel .slip-row{padding-block:5px}
  .docpanel .doc-left .card-ico{display:none}
  body.wide.in-card .stage{padding-bottom:76px}
  body.wide main{padding-bottom:20px}
  .panel.docpanel{padding:24px 28px}
  .finishpanel .check{padding-block:10px}
  .panel.finishpanel,.panel.callpanel{grid-template-columns:1fr 1fr;column-gap:32px;align-items:start}
  .finishpanel .checks{grid-row:1/span 2}
  .finishpanel > p,.finishpanel .choice{grid-column:2}
  .finishpanel > p{align-self:end}
  .callpanel{grid-auto-flow:dense}
  .callpanel .about{grid-column:1/-1}
  .callpanel fieldset{grid-column:1}
  .callpanel .field,.callpanel > button{grid-column:2}
}

/* recap */
.panel.recap{background:linear-gradient(160deg,var(--cadet-2),var(--cadet));color:#fff;box-shadow:0 0 0 2px var(--lemon),var(--shadow)}
.recap .eyebrow{color:var(--lemon)}
.recap h2{color:#fff}
.recap ol{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:rc}
.recap li{counter-increment:rc;display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;font-weight:600}
.recap li::before{content:counter(rc);flex:none;width:32px;height:32px;border-radius:50%;background:var(--lemon);color:var(--on-lemon);display:grid;place-items:center;font-family:var(--head);font-weight:900}

.about{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:12px 14px}
.about .ico{width:40px;height:40px;border-radius:12px;background:var(--surface)}
.about small{display:block;color:var(--muted);font-size:13px}
.about b{display:block;line-height:1.35}
.about .x{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
.about .x:hover{background:var(--sunk);color:var(--ink)}
/* payslip */
.slip{border-radius:16px;overflow:hidden;font-size:14.5px;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line)}
.slip-head{background:var(--cadet);color:rgba(255,255,255,.75);padding:12px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;border-bottom:3px solid var(--lemon)}
.slip-head b{color:#fff;font-size:14px}
.slip-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.slip-head + .slip-row{border-top:0}
.slip-row .lbl{flex:1;min-width:0}
.slip-row .lbl small{display:block;color:var(--muted);font-size:12.5px}
.slip-row .amt{font-weight:600;white-space:nowrap}
.slip-row.total{background:var(--soft);font-weight:700}
.slip-row.total .amt{font-family:var(--head);font-weight:900;font-size:19px}
.slip-row.sel{background:var(--sunk)}
.hot{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--lemon);color:var(--on-lemon);font:900 14px var(--head);cursor:pointer;display:grid;place-items:center}
.hot.seen{background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.hot.cur{background:var(--cadet);color:#fff;box-shadow:0 0 0 3px var(--lemon)}
@media (prefers-reduced-motion:no-preference){.hot:not(.seen):not(.cur){animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,199,26,.5)}50%{box-shadow:0 0 0 6px rgba(245,199,26,0)}}}
.explain{background:var(--sunk);padding:4px 16px 14px 54px;display:grid;gap:4px;font-size:15px}
.explain b{font-family:var(--head);font-size:17px}
.count{font-size:13px;color:var(--muted)}
.slip-note{font-size:12px;color:var(--muted);text-align:right;padding:6px 14px;border-top:1px solid var(--line)}

/* finish, call, done */
.checks{display:grid;gap:10px}
.rule-sub{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:1px}
.check{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--sunk);cursor:pointer;font-weight:600;transition:background .15s}
.check input{appearance:none;-webkit-appearance:none;width:24px;height:24px;flex:none;margin:0;border-radius:8px;border:2px solid var(--muted);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.check input:checked{background:var(--lemon);border-color:var(--lemon)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid var(--on-lemon);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check:has(input:checked){background:var(--soft)}
.choice{display:grid;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}

<script>
var SECTIONS=[
 {title:"Who's who",topics:"Employer and employee · the Trust · nominated representative",mins:3,cards:[
  {i:"user",h:"You are the employer",b:"The [[employer]] is the person who agreed with our Advice Team to take on this role. HMRC will register you and write to you.",more:"This isn't always the person who receives care. If you manage the [[direct payment]] for a family member, the employer is usually you."},
  {i:"people",h:"The employee",b:"Your [[employee]] is the person you pay to provide support, such as a personal assistant.",fact:"Never the same person",factNote:"The employer and the employee can never be the same person."},
  {i:"bank",h:"The Trust funds you. We run the payroll.",b:"Your Health &amp; Social Care Trust provides the funding. CILNI is your [[payroll provider]]. We don't hold your money, can't see your bank account, and can't change your funding."},
  {i:"send",h:"What you tell us, we report",b:"As a [[payroll bureau]], we're <span class='mark'>legally required</span> to report the hours and pay you tell us about to [[HMRC]]. Only tell us about work paid for from your direct payment.",more:"A gift to a friend or family member isn't payroll. If you're unsure whether something counts, ask us before you send it in."},
  {i:"userCheck",h:"Nominated representative",b:"Someone you choose to deal with us on your behalf. You can remove them at any time. Only <b>you or your [[nominated representative]]</b> can make changes to your account."},
  {recap:["You're the employer","The Trust funds you and we run the payroll","We must report what you tell us"]}
 ]},
 {title:"Your staff and their pay",topics:"Start dates · pay rates · your pay date",mins:4,cards:[
  {i:"search",h:"Check your details",b:"We'll confirm each employee's <b>start date, hours and rate of pay</b>. These often change after the Advice Team first sees them, so tell us if anything is different."},
  {i:"clock",h:"Set hours or variable hours?",list:[{i:"calendar",t:"Set hours",d:"The same hours every month."},{i:"swap",t:"Variable hours",d:"Hours change from month to month."}],more:"We'll help you choose the one that suits your situation."},
  {i:"pay",h:"Your pay rate",b:"Your rate is either set by a budget from our team, or chosen by you, as long as it's at or above the <span class='mark'>[[National Minimum Wage]]</span>."},
  {i:"calendar",h:"Your pay date",fact:"1 calendar month",factNote:"Your pay date is one calendar month after your first employee starts.",calc:true},
  {i:"history",h:"Payments for earlier work",b:"If you ask us to pay for work done before payroll started, we can. It goes through payroll, and <b>it will be taxed</b>."},
  {recap:["Tell us if start dates, hours or rates change","Pay must be at least the minimum wage","Pay day is one month after your first employee starts"]}
 ]},
 {title:"Your monthly routine",topics:"The monthly email · types of hours · pay day",mins:4,cards:[
  {i:"repeat",h:"Your month in 4 steps",steps:["We email you","You check the hours","We send your documents","You pay your employee and HMRC"]},
  {i:"mail",h:"Our email arrives",fact:"7 days",factNote:"before your pay date, asking you to confirm your employees' hours."},
  {i:"clock",h:"Three types of hours",list:[{i:"clock",t:"Standard hours",d:"Based on your weekly funding from the Trust."},{i:"sun",t:"Annual leave",d:"Paid time off. We keep a running total."},{i:"plus",t:"Extra hours",d:"For example, covering someone's holiday."}]},
  {i:"send",h:"Reply as soon as you can",b:"Send your hours to <b>payroll@cilni.org</b>. We need <span class='mark'>1 full working day</span> to prepare your documents."},
  {i:"wallet",h:"Pay day",b:"Pay your employee the [[net pay]] at the bottom of their payslip. Pay HMRC the amount on your [[P30]], <span class='mark'>on the same day</span>."},
  {recap:["We email you 7 days before pay day","Reply with the hours","Pay your employee and HMRC on the same day"]}
 ]},
 {title:"Your documents",topics:"Payslips · passwords · Trust summary · P30",mins:5,cards:[
  {i:"lock",h:"Your payslips are locked",b:"Payslips are <b>password-protected</b>. Choose a password you're happy to share with your employee.",more:"Trouble opening one? Passwords are case-sensitive. Watch for spaces, or try copying and pasting the password. Still stuck? Tap Talk to us."},
  {i:"doc",h:"Reading a payslip",b:"Tap each number to see what it means.",doc:"slip"},
  {i:"docCheck",h:"Check it, then send it",b:"If the payslip looks right, send it to your employee with their pay. If something's wrong, tell us and we'll fix it before you pay."},
  {i:"folder",h:"The summary for the Trust",b:"A summary of each month's payroll. Keep it safe. The Trust may ask for it <span class='mark'>every quarter</span>, along with your bank statements."},
  {i:"wallet",h:"Your buffer",fact:"5–8 weeks",factNote:"The Trust pays this much funding in advance, so there should always be money in the account on pay day."},
  {i:"receipt",h:"Reading your P30",b:"Your P30 shows <b>one total</b> to pay HMRC for all your employees. Tap each number to see what it means.",doc:"p30"},
  {recap:["Payslips are password-protected","Pay the net pay at the bottom","Keep your Trust summaries and bank statements"]}
 ]},
 {title:"HMRC",topics:"Registering · your reference · paying HMRC · letters",mins:4,cards:[
  {i:"bank",h:"We register you with HMRC",b:"Once you've confirmed your details, <b>we</b> register you as an employer with [[HMRC]]. It's the tax for your employees, not your own tax bill."},
  {i:"alert",h:"Don't pay HMRC yet",warn:"Wait until we send your HMRC reference.",b:"You <b>can</b> still pay your employees in the meantime. The figures on their payslips are correct."},
  {i:"hash",h:"Your HMRC reference",fact:"13 characters",factNote:"We'll email your HMRC bank details and reference. It never changes."},
  {i:"send",h:"Set up HMRC as a payee",b:"Add HMRC as a payee in your online banking, with your 13-character reference. Then each month, just pay that payee."},
  {i:"calendar",h:"Why the dates don't match",b:"HMRC's months run from the <span class='mark'>6th to the 5th</span>. The dates on your P30 won't always match your pay date. That's normal."},
  {i:"mail",h:"Got a letter from HMRC?",list:[{i:"check",t:"Already paid?",d:"Contact us and we'll help challenge it."},{i:"pay",t:"Not paid?",d:"Pay the amount due. A little interest may be added."}]},
  {recap:["Don't pay HMRC until you get your reference","Use your 13-character reference every time","Already paid and got a letter? Contact us"]}
 ]},
 {title:"Your responsibilities",topics:"Cash · sickness · holidays · pensions",mins:5,cards:[
  {i:"ban",h:"Don't pay cash",fact:"Bank transfer or cheque",factNote:"Cash leaves no record. If an employee disputes their pay, you'd have no proof."},
  {i:"heart",h:"Sickness and time off",b:"If your employee is off sick, or going on maternity or paternity leave, tell us when you send in the hours. They may be entitled to [[statutory pay]]."},
  {i:"sun",h:"Holidays",fact:"5.6 weeks",factNote:"Employees get this much paid holiday a year, including bank holidays. Up to 1.6 weeks can be carried over."},
  {i:"shield",h:"Workplace pension",b:"Some employees must be <b>[[automatically enrolled]]</b> in a pension. We'll tell you when, and what to do."},
  {i:"mail",h:"Letters from The Pensions Regulator",b:"Every <span class='mark'>3 years</span> you'll get a letter about a declaration. We get a copy and deal with it, so just file it away."},
  {i:"userCheck",h:"Your account, your say",b:"Our contract is with <b>you</b>. Changes must come from you or your nominated representative."},
  {recap:["Never pay cash","Tell us about sickness and leave","Employees get 5.6 weeks' holiday"]}
 ]},
 {title:"When things change",topics:"New starters · leavers · other changes",mins:3,cards:[
  {i:"userPlus",h:"Taking on a new employee",b:"Let us know before they start. We'll tell you what we need."},
  {i:"userMinus",h:"An employee leaves",b:"Tell us their last working day and any holiday they haven't taken."},
  {i:"edit",h:"Changes to hours, pay or details",b:"Email payroll@cilni.org with any change to hours, pay rate, address or bank details."},
  {i:"help",h:"Not sure? Ask us",b:"Even if it isn't a payroll question, we'll point you in the right direction."},
  {recap:["Tell us about new starters and leavers","Email us with any changes","If in doubt, ask"]}
 ]}
];

// Plain-English meanings for the underlined words on the cards.
var GLOSS={
 "employer":"The person who pays the employee and is registered with HMRC. Here, that's you.",
 "employee":"The person you pay to provide support, such as a personal assistant.",
 "direct payment":"Money from the Trust so you can arrange and pay for your own care and support.",
 "payroll provider":"The organisation that works out pay, tax and National Insurance and makes the payslips. That's CILNI.",
 "payroll bureau":"Another name for a payroll provider. That's CILNI.",
 "hmrc":"HM Revenue and Customs, the UK's tax authority.",
 "nominated representative":"Someone you choose to deal with CILNI for you. You can remove them at any time.",
 "national minimum wage":"The lowest hourly rate the law allows. It usually goes up every April.",
 "net pay":"What your employee takes home after tax, National Insurance and pension are taken off. It's at the bottom of the payslip.",
 "p30":"The monthly document from CILNI that shows the one total you pay HMRC.",
 "statutory pay":"Pay set by law for times like sickness or maternity leave, such as Statutory Sick Pay.",
 "automatically enrolled":"When an employer must put an employee into a workplace pension without the employee asking."
};

var SEC_ICON=['people','pay','calendar','doc','bank','shield','swap'];
function ic(n,cls){return '<svg class="i'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>';}

// How long Next stays locked the first time a card is shown: a short base time
// plus a little per word, between 1 and 3.5 seconds.
var WAIT_BASE_MS=700, WAIT_PER_WORD_MS=55, WAIT_MIN_MS=1000, WAIT_MAX_MS=3500;
function words(h){return String(h||'').replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/g,' ').split(/\s+/).filter(Boolean).length;}
function waitFor(c){
  var n=c.recap?words(c.recap.join(' ')):words(c.h)+words(c.b)+words(c.fact)+words(c.factNote)+words(c.warn)+words((c.steps||[]).join(' '))+words((c.list||[]).map(function(x){return x.t+' '+x.d;}).join(' '));
  if(c.doc)n+=15;
  return Math.max(WAIT_MIN_MS,Math.min(WAIT_MAX_MS,WAIT_BASE_MS+n*WAIT_PER_WORD_MS));
}
// Link to the welcome video once it exists. Leave empty until then.
var VIDEO_URL='';
var GUARD_MS=500;   // ignore a second press within this time (stops double-taps)
var lastPress={};
// Only a repeat press of the same control is ignored, so a quick tap on a different button still works.
function guard(k){var n=Date.now();if(n-(lastPress[k]||0)<GUARD_MS)return false;lastPress[k]=n;return true;}
var KEY='cilni-portal-draft9';
function fresh(){return {started:false,done:[],seen:{},pos:{},explored:{slip:{},p30:{}},acks:{},form:{},about:'',confirmedAt:0,path:'',from:'',big:false,theme:'auto',swipeHinted:false,startDate:'',view:'welcome',sec:0,card:0,updatedAt:0};}
var state=fresh();
function adopt(d){var f=fresh();Object.keys(f).forEach(function(k){if(d&&d[k]!==undefined&&d[k]!==null)f[k]=JSON.parse(JSON.stringify(d[k]));});state=f;}
try{var saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved)adopt(saved);}catch(e){}
var lastVisit=state.updatedAt,interacted=false,viewerName='';
// Show a "welcome back" screen when someone returns part-way through.
var showResume=state.started&&state.view!=='welcome';

/* Saving: always to this browser straight away, and also to the person's own
   private record on their claude.ai account when that's available, so it works
   on another device. */
var cloud={ref:null,ok:false,busy:false,again:false,timer:0};
function save(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  if(cloud.ok){clearTimeout(cloud.timer);cloud.timer=setTimeout(push,800);}
  setStatus();
}
function push(){
  if(!cloud.ok)return;
  if(cloud.busy){cloud.again=true;return;}
  cloud.busy=true;
  cloud.ref.set(JSON.parse(JSON.stringify(state))).catch(function(e){
    if(e&&e.code==='unavailable'){cloud.again=true;}else{cloud.ok=false;setStatus();}
  }).then(function(){cloud.busy=false;if(cloud.again){cloud.again=false;setTimeout(push,cloud.ok?400:0);}});
}
function setStatus(){
  var el=document.getElementById('saveStatus');if(!el)return;
  if(!state.started){el.innerHTML='';return;}
  el.innerHTML=ic('check')+(cloud.ok?'Progress saved to your account':'Progress saved on this device');
}
function initDownloads(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  window.claude.use('downloads').then(function(d){downloads=d||null;showSaveBtn();}).catch(function(){});
}
function showSaveBtn(){var b=document.getElementById('saveFactsBtn');if(b)b.hidden=!downloads;}
function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user)return;
    return Promise.all([user.id(),user.name()]).then(function(v){
      var uid=v[0];viewerName=v[1]||'';if(!uid)return;
      var ref=db.doc('data/users/'+uid+'/progress');
      return ref.get().then(function(snap){
        cloud.ref=ref;cloud.ok=true;
        var d=snap.exists?snap.data():null;
        if(d&&(d.updatedAt||0)>(state.updatedAt||0)&&!interacted){
          adopt(d);lastVisit=state.updatedAt;
          try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
          showResume=state.started&&state.view!=='welcome';
        }else if(state.started&&(!d||(state.updatedAt||0)>(d.updatedAt||0))){push();}
        if(!interacted)render();else setStatus();
      });
    });
  }).catch(function(){cloud.ok=false;setStatus();});
}
function ago(t){
  if(!t)return '';var m=Math.round((Date.now()-t)/60000);
  if(m<2)return 'just now';if(m<60)return m+' minutes ago';
  var h=Math.round(m/60);if(h<24)return h+(h===1?' hour ago':' hours ago');
  var d=Math.round(h/24);return d===1?'yesterday':d+' days ago';
}
var menuHost=document.getElementById('menuHost'),app=document.getElementById('app'),stage=document.getElementById('stage'),dir='';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function go(view,extra,d){interacted=true;showResume=false;dir=d||'';Object.assign(state,{view:view},extra||{});if(view==='card')state.pos[state.sec]=state.card;save();render();window.scrollTo(0,0);}

function render(){
  stopSpeaking();termOpen='';
  var r=showResume?resume():{welcome:welcome,hub:hub,card:card,finish:finish,call:call,done:done}[state.view]();
  document.body.classList.toggle('in-card',!showResume&&state.view==='card');
  document.body.classList.toggle('big',!!state.big);
  var cc=state.view==='card'&&SECTIONS[state.sec]?SECTIONS[state.sec].cards[state.card]:null;
  document.body.classList.toggle('wide',!showResume&&(state.view==='hub'||state.view==='finish'||state.view==='call'||!!(cc&&cc.doc)));
  applyTheme();
  setStatus();
  stage.innerHTML=r.stage;
  menuHost.innerHTML=/id="dispBtn"/.test(r.stage)?displayMenu():'';
  app.innerHTML='<div class="view '+dir+'">'+r.body+'</div>';
  bind();showSaveBtn();
}

   '<ul class="ticks"><li>'+ic('check')+'<span>7 short sections, about 30 minutes</span></li><li>'+ic('check')+'<span>It isn\'t a test</span></li><li>'+ic('check')+'<span>Stop any time. We\'ll save your place</span></li><li>'+ic('check')+'<span>Prefer to talk? Ask for a call at any point</span></li></ul>'+

// The first unfinished section other than this one, or -1 when there isn't one.
function sectionAfter(cur){for(var i=0;i<SECTIONS.length;i++)if(i!==cur&&state.done.indexOf(i)<0)return i;return -1;}
// Search across every card once the guide is finished.
var searchQ='';
function searchIndex(){
  var out=[];
  SECTIONS.forEach(function(s,si){s.cards.forEach(function(c,ci){
    var title=c.recap?'Recap: three things to remember':plain(c.h);
    var parts=c.recap?c.recap.slice():[c.warn,c.b,(c.list||[]).map(function(x){return x.t+'. '+x.d;}).join(' '),c.fact,c.factNote,(c.steps||[]).join('. '),c.more];
    if(c.doc)parts.push(DOCS[c.doc].rows.map(function(r){return r.t+'. '+r.x;}).join(' '));
    out.push({si:si,ci:ci,sec:s.title,title:title,text:plain(parts.filter(Boolean).join(' '))});
  });});
  out.push({facts:true,sec:'After you finish',title:'Your key facts',text:FACTS.map(function(f){return f.t+' '+(f.d||'pay date');}).join(' ')});
  return out;
}
function showResults(){
  var box=document.getElementById('results'),tiles=document.getElementById('tiles');if(!box)return;
  var words=searchQ.toLowerCase().split(/\s+/).filter(function(w){return w.length>1;});
  if(!words.length){box.innerHTML='';if(tiles)tiles.hidden=false;return;}
  if(tiles)tiles.hidden=true;
  var hits=searchIndex().filter(function(x){var t=(x.sec+' '+x.title+' '+x.text).toLowerCase();return words.every(function(w){return t.indexOf(w)>=0;});});
  if(!hits.length){box.innerHTML='<p class="muted noresult">Nothing found for that. Try a different word, or tap Talk to us.</p>';return;}
  box.innerHTML='<p class="count">'+hits.length+(hits.length===1?' card':' cards')+' found</p>'+hits.slice(0,12).map(function(x){
    var t=x.text,i=t.toLowerCase().indexOf(words[0]),snip=i<0?t.slice(0,110):(i>40?'…'+t.slice(i-40,i+80):t.slice(0,120));
    if(snip.length<t.length&&!/…$/.test(snip))snip+='…';
    return '<button class="tile hit" type="button" '+(x.facts?'data-act="facts"':'data-go="'+x.si+'-'+x.ci+'"')+'><span><span class="s">'+esc(x.sec)+'</span><span class="t">'+esc(x.title)+'</span><span class="s snip">'+esc(snip)+'</span></span><span class="go">'+ic('chev')+'</span></button>';
  }).join('');
  box.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){var p=b.dataset.go.split('-');go('card',{sec:+p[0],card:+p[1]},'fwd');};});
  box.querySelectorAll('[data-act=facts]').forEach(function(b){b.onclick=function(){go('done');};});
}
function nextIndex(){for(var i=0;i<SECTIONS.length;i++)if(state.done.indexOf(i)<0)return i;return -1;}

function payDate(v){

  var y=+p[0],m=+p[1]-1,d=+p[2];
  var ny=m===11?y+1:y,nm=(m+1)%12,last=new Date(ny,nm+1,0).getDate();
  var dt=new Date(ny,nm,Math.min(d,last));
  var f=dt.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  var ord=function(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};
  return 'Your first pay date would be '+f+', then the '+ord(d)+' of each month'+(d>28?' (or the last day in shorter months)':'')+'.';
}

function tryStep(which){
  if(state.view!=='card'||showResume)return;
  var b=app.querySelector('[data-act='+which+']');if(!b)return;
  if(b.classList.contains('wait')){b.classList.remove('nudge');void b.offsetWidth;b.classList.add('nudge');return;}
  if(guard(which))act(which);
}
(function(){
  var x0=null,y0=0,t0=0;
  app.addEventListener('touchstart',function(e){
    if(e.touches.length!==1||e.target.closest('input,textarea,select,summary,.docbox,.calc')){x0=null;return;}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now();
  },{passive:true});
  app.addEventListener('touchend',function(e){
    if(x0===null)return;var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5||Date.now()-t0>800)return;
    tryStep(dx<0?'next':'prev');
  },{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('input,textarea,select'))return;
    if(e.key==='ArrowRight')tryStep('next');else if(e.key==='ArrowLeft')tryStep('prev');
  });
})();

function act(a){
  var s=SECTIONS[state.sec];
  if(a==='start'){state.started=true;go('hub');}
  else if(a==='hub')go('hub');
  else if(a==='continue'){go(state.view,{},'fwd');}
  else if(a==='call'){if(state.view!=='call')go('call',{from:state.view,about:''});}
  else if(a==='talk'){if(state.view!=='call')go('call',{from:state.view,about:aboutText()});}
  else if(a==='clearAbout'){state.about='';save();render();}
  else if(a==='back')go(state.from&&state.from!=='call'?state.from:'hub');
  else if(a==='finish')go('finish');
  else if(a==='display')openMenu();
  else if(a==='speak')speak();
  else if(a==='facts')go('done');
  else if(a==='saveFacts')saveFacts();
  else if(a==='confident')go('done',{path:'confident',confirmedAt:Date.now()});
  else if((a==='prev'||a==='next')&&state.view==='card'&&!state.swipeHinted&&isTouch){state.swipeHinted=true;act(a);}
  else if(a==='prev'){if(state.card>0)go('card',{card:state.card-1},'bwd');else go('hub');}
  else if(a==='next'){
    if(state.card<s.cards.length-1)go('card',{card:state.card+1},'fwd');
    else{var n=sectionAfter(state.sec);if(state.done.indexOf(state.sec)<0)state.done.push(state.sec);state.pos[state.sec]=0;if(n>=0)go('card',{sec:n,card:state.pos[n]||0},'fwd');else go('hub');}
  }
  else if(a==='reset'){
    var rb=app.querySelector('[data-act=reset]');
    if(rb&&!rb.dataset.armed){rb.dataset.armed='1';rb.textContent='Tap again to clear all your progress';setTimeout(function(){if(rb.isConnected){delete rb.dataset.armed;rb.textContent=rb.dataset.label;}},4000);return;}
    state=fresh();docCur={slip:-1,p30:-1};save();go('welcome');
  }
}
document.getElementById('talkBtn').onclick=function(){if(guard('talk')){showResume=false;act('talk');}};
if(state.view==='card'&&!SECTIONS[state.sec])state.view='hub';
render();
initCloud();
initDownloads();
</script>
